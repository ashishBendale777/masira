<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100dvh;
            width: 100%;
        }

        header {
            height: 100%;
            width: 100%;
            /* background-color: blue; */
        }

        nav {
            height: 10%;
            width: 100%;
            background-color: red;
            position: fixed;
            top: 0;
        }

        ul {
            height: 100%;
            width: 100%;
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
            list-style-type: none;
        }

        li a {
            text-decoration: none;
            color: black;
            font-size: 1.5rem;
        }

        section {
            height: 100%;
            width: 100%;
            padding: 12px;
            /* background-color: red; */
        }

        footer {
            height: 40%;
            width: 100%;
            background-color: green;
        }

        .books-container {
            width: 100%;
            height: 80%;
            display: grid;
            margin: 4px;
            grid-template-columns: repeat(3, 1fr) 2fr;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            gap: 12px;
        }

        .book-item {
            background-color: red;
        }


        .team-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 24px;
            padding: 24px;
        }

        .team-card {
            width: 220px;
            padding: 24px;
            background-color: white;
            border-radius: 12px;
            text-align: center;
        }

        /* Horizontal offset | Vertical offset | Blur | Spread | Color */
        .card-one {
            box-shadow: 6px 6px 22px 6px gray;
        }

        /* Negative offsets place the shadow toward the top and left */
        .card-two {
            box-shadow: -6px -6px 12px 2px lightblue;
        }

        /* Inset creates a shadow inside the card */
        .card-three {
            box-shadow: inset 0px 0px 16px 3px gray;
        }

        /* Multiple shadows are separated by a comma */
        .card-four {
            box-shadow: 5px 5px 12px 0px lightblue,
                -5px -5px 12px 0px pink;
        }

        .team-card h2 {
            margin-bottom: 12px;

            /* Horizontal offset | Vertical offset | Blur | Color */
            text-shadow: 2px 2px 3px lightgray;
        }

        .team-card p {
            color: #555;
        }
    </style>
</head>

<body>
    <header id="home">
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#books">Books</a></li>
                <li><a href="#packages">Packages</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#team">Team</a></li>
            </ul>
        </nav>
    </header>
    <section id="books">
        <h1>Books</h1>
        <div class="books-container">
            <div class="book-item">
                <p>Book 1</p>
            </div>

            <div class="book-item">
                <p>Book 2</p>
            </div>

            <div class="book-item">
                <p>Book 3</p>
            </div>

            <div class="book-item">
                <p>Book 4</p>
            </div>
            <div class="book-item">
                <p>Book 5</p>
            </div>

            <div class="book-item">
                <p>Book 6</p>
            </div>


            <div class="book-item">
                <p>Book 7</p>
            </div>
        </div>
    </section>

    <section id="packages">
        <h1>Packages</h1>

    </section>


    <section id="about">
        <h1>About</h1>

    </section>

    <section id="team">
        <h1>Team</h1>

        <div class="team-container">
            <div class="team-card card-one">
                <h2>Ashish</h2>
                <p>Web Developer</p>
            </div>

            <div class="team-card card-two">
                <h2>Priya</h2>
                <p>UI Designer</p>
            </div>

            <div class="team-card card-three">
                <h2>Rahul</h2>
                <p>Backend Developer</p>
            </div>

            <div class="team-card card-four">
                <h2>Neha</h2>
                <p>Project Manager</p>
            </div>
        </div>
    </section>

    <footer>
        <h1>Footer Section</h1>
    </footer>

</body>

</html>
