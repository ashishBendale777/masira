<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100dvh;
            width: 100%;
        }

        header {
            height: 100%;
            width: 100%;
            /* background-color: blue; */
        }

        nav {
            height: 10%;
            width: 100%;
            background-color: red;
            position: fixed;
            top: 0;
        }

        ul {
            height: 100%;
            width: 100%;
            display: flex;
            gap: 16px;
            justify-content: center;
            align-items: center;
            list-style-type: none;
        }

        li a {
            text-decoration: none;
            color: black;
            font-size: 1.5rem;
        }

        section {
            height: 100%;
            width: 100%;
            padding: 12px;
            /* background-color: red; */
        }

        footer {
            height: 40%;
            width: 100%;
            background-color: green;
        }

        .books-container {
            width: 100%;
            height: 80%;
            display: grid;
            margin: 4px;
            grid-template-columns: repeat(3, 1fr) 2fr;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            gap: 12px;
        }

        .book-item {
            background-color: red;
        }
    </style>
</head>

<body>
    <header id="home">
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#books">Books</a></li>
                <li><a href="#packages">Packages</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#team">Team</a></li>
            </ul>
        </nav>
    </header>
    <section id="books">
        <h1>Books</h1>
        <div class="books-container">
            <div class="book-item">
                <p>Book 1</p>
            </div>

            <div class="book-item">
                <p>Book 2</p>
            </div>

            <div class="book-item">
                <p>Book 3</p>
            </div>

            <div class="book-item">
                <p>Book 4</p>
            </div>
            <div class="book-item">
                <p>Book 5</p>
            </div>
            
            <div class="book-item">
                <p>Book 6</p>
            </div>

            
            <div class="book-item">
                <p>Book 7</p>
            </div>
        </div>
    </section>

    <section id="packages">
        <h1>Packages</h1>

    </section>


    <section id="about">
        <h1>About</h1>

    </section>

    <section id="team">
        <h1>Team</h1>

    </section>

    <footer>
        <h1>Footer Section</h1>
    </footer>

</body>

</html>
