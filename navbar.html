<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100dvh;
            width: 100%;
        }

        header {
            height: 80px;
            width: 100%;
            /* background-color: red; */
        }

        nav {
            height: 100%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-left: 14px;
        }

        nav img {
            height: 100%;
            width: 300px;
        }

        ul {
            height: 100%;
            display: flex;
            gap: 14px;
            list-style: none;
            align-items: center;
            padding-right: 14px;
        }

        ul li {
            font-size: 2.2rem;    
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <img src="./images/banner.jpg" alt="">
            <ul>
                <li>Home</li>
                <li>Services</li>
                <li>Products</li>
                <li>Team</li>
                <li>About</li>
            </ul>
        </nav>
    </header>
</body>

</html>
