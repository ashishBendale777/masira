<!DOCTYPE html>
<html lang="en">

<head>
    <title>Document</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            height: 100dvh;
            width: 100%;
        }

        
        section {
            height: 100%;
            width: 100%;
            display: flex;
            gap: 12px;
        }

        .image-container {
            /* background-color: red; */
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }
        .image-container img {
            height: 400px;
            width: 400px;
            border-radius: 50%;
        }

        .info-container{
            flex-grow: 1;
            display: flex;
            gap: 24px;
            flex-direction: column;
            justify-content: center;
        }

        .info-container h1{
            font-size: 6rem;
            letter-spacing: 4px;
            font-style: italic;
        }

        .info-container p{
            font-size: 2.5rem;
        }

        .btn-container button{
            background: none;
            font-size: 1.5rem;
            border: 4px solid green;
            padding: 10px 20px;
            border-radius: 24px;
        }

        .btn-container button:hover{
            background-color: blue;
            font-style: italic;
        }
    </style>
</head>

<body>
    <section>
        <div class="info-container">
            <h1>Art Of Design</h1>
            <p>
                Lorem ipsum dolor sit amet consectetur, adipisicing elit. Quas temporibus eaque dolorem eligendi
            </p>
            <div class="btn-container">
                <button>Free Consultation</button>
                <button>Buy Credits</button>
            </div>
        </div>
        <div class="image-container">
            <img src="./images/banner.jpg" alt="">
        </div>
    </section>
</body>

</html>
